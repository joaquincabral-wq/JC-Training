<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="JC Training: entrenamiento, nutrición y progreso personal." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="v3.css" />
  <title>JC Training</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar"><div><div class="eyebrow">JC TRAINING</div><h1 id="pageTitle">Hoy</h1></div><button id="installBtn" class="ghost-btn hidden">Instalar</button></header>
    <main id="content" class="content"></main>
    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-view="today" class="nav-btn active">Hoy</button><button data-view="training" class="nav-btn">Entreno</button><button data-view="meals" class="nav-btn">Comidas</button><button data-view="progress" class="nav-btn">Progreso</button><button data-view="history" class="nav-btn">Historial</button>
    </nav>
  </div>
  <div id="timerOverlay" class="timer-overlay hidden" role="dialog" aria-modal="true"><div class="timer-card"><div class="eyebrow">DESCANSO</div><div id="timerExercise" class="timer-exercise"></div><div id="timerValue" class="timer-value">00:00</div><div class="timer-actions"><button id="timerAdd" class="secondary-btn">+30 s</button><button id="timerPause" class="secondary-btn">Pausa</button><button id="timerSkip" class="primary-btn">Saltar</button></div></div></div>
  <script src="app.js"></script>
  <script src="v3.js"></script>
</body>
</html>
